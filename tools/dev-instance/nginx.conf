# Sunstone's dev instance at /sunstone/ on an existing site. Installed as
# /etc/nginx/snippets/sunstone-dev.conf, with one line inside the site's
# server { } block:
#
#     include snippets/sunstone-dev.conf;
#
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Sunstone has no sign-in, so nginx asks for one: the accounts are in
# /etc/nginx/sunstone-dev.htpasswd (see the README's "Dev instance").

# Relative redirects stay right behind TLS-terminating load balancers and odd ports.
location = /sunstone {
    absolute_redirect off;
    return 301 /sunstone/;
}

# ^~ keeps the site's regular-expression locations from claiming Sunstone's
# assets. The trailing "/" of proxy_pass strips /sunstone; the web UI asks for
# everything relative to its page, so it stays under /sunstone/.
location ^~ /sunstone/ {
    auth_basic "Sunstone dev";
    auth_basic_user_file /etc/nginx/sunstone-dev.htpasswd;

    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
