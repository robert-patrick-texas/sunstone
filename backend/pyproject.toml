[project]
name = "sunstone"
dynamic = ["version"]  # read from the repository's VERSION file only
description = "Sunstone backend: serves network topology to the map views"
license = "Apache-2.0"
authors = [
    { name = "Robert Patrick", email = "193846785+robert-patrick-texas@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
sunstone = "sunstone.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/sunstone"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
