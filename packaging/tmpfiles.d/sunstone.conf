# Directories Sunstone needs, created by postinst with
# `systemd-tmpfiles --create sunstone.conf`. The package owns none of them,
# so dpkg never removes or overwrites configuration or saved state.
#
# /var/lib/sunstone itself is root's, holding two directories: state/, which
# the service writes, and update/, self-update's package cache, backups,
# record, and lock, which only root may open. The service account so cannot
# plant a package or backup for root to install or restore, nor replace the
# update directory, since it cannot write their parent.
#Type Path                      Mode User     Group    Age
d     /etc/sunstone             0750 root     sunstone -
d     /var/lib/sunstone         0755 root     root     -
d     /var/lib/sunstone/state   0750 sunstone sunstone -
d     /var/lib/sunstone/update  0700 root     root     -
